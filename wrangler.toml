name = "sinfrenos"
main = ".open-next/worker.js"
compatibility_date = "2025-01-07"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "sinfrenos"

# Workers Rate Limiting API: contador compartido a nivel de cuenta/ubicación
# (no por isolate, a diferencia del Map en memoria que reemplaza en
# middleware.ts). namespace_id es un identificador propio, no un ID real de
# Cloudflare — solo debe ser único dentro de esta cuenta.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 300
  period = 60

# Rate limiter separado para navegación GET normal (antes sin ningún
# límite). Umbral propio y más generoso que RATE_LIMITER porque este
# corre en TODAS las rutas de contenido, no solo /api y /dashboard —
# ver NAV_RATE_LIMIT_MAX_REQUESTS en middleware.ts, debe coincidir con
# el `limit` de acá.
[[ratelimits]]
name = "NAV_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 400
  period = 60

