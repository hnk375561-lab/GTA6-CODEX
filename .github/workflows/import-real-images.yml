name: Import real images

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'GTA6-CODEX/real-images-manifest.json'
      - 'GTA6-CODEX/.trigger-import-images'

permissions:
  contents: write

concurrency:
  group: import-real-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: GTA6-CODEX
        run: npm install --no-save sharp

      # --overwrite: el manifest es curado a mano (fuentes ya verificadas
      # una por una), asi que siempre corresponde re-generar si cambia el
      # pipeline (ver scripts/import-real-images.mjs, techo subido a
      # 3840x2160/q92 el 19 ago 2026 — antes 1600x900/q82 aplastaba
      # capturas 4K reales antes de llegar al sitio).
      - name: Run import script
        working-directory: GTA6-CODEX
        run: node scripts/import-real-images.mjs --apply --overwrite

      - name: Commit and push
        if: always()
        working-directory: GTA6-CODEX
        run: |
          git config user.name "gta6-codex-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/images/entities 2>/dev/null || true
          git add -f .ci-debug 2>/dev/null || true
          git diff --cached --quiet && echo "Nada para commitear" && exit 0
          git commit -m "feat(images): importa imagenes reales verificadas desde real-images-manifest.json [OK=${IMPORT_OK:-?} FAIL=${IMPORT_FAIL:-?}]"
          git push origin main
