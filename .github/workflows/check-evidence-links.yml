name: Chequear links de evidencia

# Corre scripts/check-evidence-links.mjs contra src/content/vehiculos:
# revisa que primarySource/secondarySource sigan respondiendo. Si algo
# se cayo con el tiempo, abre (o actualiza) un Issue en vez de fallar
# en silencio - asi alguien puede re-enriquecer esas fichas puntuales.
#
# Corre solo, todos los dias 1 de cada mes, y tambien se puede disparar
# a mano desde la pestana Actions.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 8 1 * *"

defaults:
  run:
    working-directory: GTA6-CODEX

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Correr link-checker
        id: check
        continue-on-error: true
        run: node scripts/check-evidence-links.mjs

      - name: Subir reporte como artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: broken-links-report
          path: GTA6-CODEX/broken-links-report.json
          if-no-files-found: ignore

      - name: Armar cuerpo del Issue
        if: steps.check.outcome == 'failure'
        id: body
        run: |
          {
            echo 'body<<EOF'
            echo "Encontrado por el workflow \`check-evidence-links.yml\` (corrida automatica mensual)."
            echo ""
            echo "URLs rotas y las fichas que las citan:"
            echo ""
            node -e "
              const r = require('./broken-links-report.json');
              for (const b of r.broken) {
                console.log('- \`' + b.url + '\` (' + (b.reason || b.status) + ')');
                for (const f of b.affectedFiles) {
                  console.log('  - ' + f.file + ' → ' + f.field);
                }
              }
            "
            echo ""
            echo "Accion sugerida: re-correr el enriquecimiento sobre esas fichas puntuales"
            echo "(por ejemplo borrando su campo \`evidence\` y disparando"
            echo "\`enrich-vehiculos.yml\` con \`only=needsBoth\`), o reemplazar la URL a mano"
            echo "si encontras la fuente movida a otra direccion."
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Crear o actualizar Issue
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🔗 Links de evidencia rotos (chequeo mensual)";
            const body = `${{ steps.body.outputs.body }}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "evidence-links",
            });
            if (issues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["evidence-links"],
              });
            }
