name: CI (type-check, lint, test, build)

# 10/09/2026 — Migración a GitHub Pages: el deploy real a producción ahora
# lo hace el workflow `deploy-pages.yml` (output: 'export' + GitHub
# Actions), no Cloudflare. Este workflow queda solo como gate de CI
# (type-check, lint, test, verificaciones de contenido y build de
# verificación) — sin ningún paso de deploy propio.
#
# Pendiente del lado de Cloudflare (no se puede resolver desde el repo):
# el Worker `sinfrenos` puede seguir teniendo activa su integración git
# nativa (Cloudflare Workers Builds), que intentaría un deploy en cada
# push a `main` de forma independiente a este workflow. Si el dashboard
# de Cloudflare sigue mostrando builds (fallidos o no) en cada push,
# desactivar esa integración en Workers & Pages → sinfrenos → Settings →
# Builds, ya que el sitio en producción ahora es GitHub Pages.
#
# 12/09/2026 — FASE 1 SUPABASE: se cambió `npm ci` por `npm install` en
# el paso de instalación (mismo motivo que en deploy-pages.yml: el
# proyecto se edita 100% desde la web de GitHub, sin terminal local para
# regenerar package-lock.json antes de cada commit, así que `npm ci`
# rompía con "package.json y package-lock.json no están sincronizados"
# apenas se agregaba una dependencia nueva a mano).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # jsdom@30 (usado por los tests, ver vitest.setup.ts) declara
  # `"engines": { "node": "^22.22.2 || ^24.15.0 || >=26.0.0" }` — con
  # Node 20.x el worker de vitest para archivos que usan entorno jsdom
  # (componentes, hooks) ni arranca: revienta al importar `undici` con
  # `TypeError: webidl.util.markAsUncloneable is not a function` antes de
  # correr un solo test. Confirmado como causa raíz el 10/09/2026 (ver
  # log de CI: "Add files via upload" → CI (type-check, lint, test,
  # build) #154). `enrich-vehicles.yml` ya usa Node 22 por este mismo
  # motivo.
  NODE_VERSION: '22.x'
  # FASE 1 SUPABASE (12/09/2026): a nivel de WORKFLOW, no de un step
  # suelto, a propósito. `npm run verify:content` corre su propio
  # `next build` interno (para confirmar que el build no se rompe pese a
  # una entidad de prueba con fecha inválida) dentro del step "Run
  # verification scripts" — un env: puesto solo en el step "Build
  # (verificación)" de más abajo NO llega a ese build interno, y
  # src/lib/supabase/client.ts revienta con "Missing Supabase
  # environment variables" al evaluarse el módulo. Poniéndolas acá,
  # TODOS los steps de TODOS los jobs las heredan, sin importar en qué
  # step se dispare un build.
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run type check
        run: npm run type-check

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: |
          set +e
          npx vitest run --reporter=default > /tmp/test-output.txt 2>&1
          code=$?
          cat /tmp/test-output.txt
          if [ $code -ne 0 ]; then
            tail -c 3500 /tmp/test-output.txt | sed ':a;N;$!ba;s/\n/%0A/g' > /tmp/test-output-encoded.txt
            echo "::error::$(cat /tmp/test-output-encoded.txt)"
          fi
          exit $code

      - name: Run verification scripts
        run: npm run verify:min-count && npm run verify:content && npm run verify:relations && npm run verify:manufacturer-slugs && npm run verify:reserved-keys && npm run verify:seo && npm run verify:adsense-csp && npm run verify:tailwind

      - name: Run price format audit
        run: npm run audit:price-formats

      # No bloqueante todavía: al momento de sumar este check, el catálogo
      # real tiene 8 vehículos sin imagen pendientes de que el workflow de
      # Commons (commons-image-manifest.yml) las resuelva. Bloquear el
      # build ahora rompería el deploy de contenido que ya está en
      # producción, por el mismo motivo que check-evidence-links no bloquea
      # más abajo. Sacar `continue-on-error` una vez que esos 8 slugs (o los
      # que queden pendientes en ese momento) tengan su imagen.
      - name: Verify image coverage (non-blocking until las imágenes pendientes se resuelvan)
        continue-on-error: true
        run: npm run verify:image-coverage

      # No bloqueante: chequea 318 URLs externas de evidencia citada en el
      # contenido. Un link caído (rate-limit, mantenimiento, bot-blocking del
      # sitio de terceros, etc.) no debe tumbar un deploy de producción por
      # algo fuera del propio repo. El reporte queda igual visible en el log
      # del job y en broken-links-report.json para revisión manual. Se
      # mantiene informativo en vez de bloqueante hasta tener suficientes
      # corridas reales en CI que confirmen que la tasa de falsos positivos
      # (links caídos por motivos ajenos al contenido) es baja.
      - name: Check evidence links (non-blocking)
        continue-on-error: true
        run: npm run check:evidence-links

      - name: Upload broken links report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broken-links-report
          path: broken-links-report.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Build (verificación — el deploy real lo hace el workflow deploy-pages.yml)
        run: npm run build
        env:
          GITHUB_PAGES_BASE_PATH: '/Sin-Frenos'
          NEXT_PUBLIC_SITE_URL: https://hnk375561-lab.github.io/Sin-Frenos
          # Las variables de Supabase ya están heredadas del env: de nivel
          # de workflow (ver arriba de todo del archivo) — no hace falta
          # repetirlas acá.
