name: CI (type-check, lint, test, build)

# El deploy real a producción lo hace Cloudflare Workers Builds (git
# integration nativa, configurada del lado de Cloudflare, que lee
# wrangler.toml directo). Este workflow quedó de la época en que el
# proyecto todavía era Cloudflare Pages (antes de la migración a Workers
# del 07/09/2026) y hasta ahora seguía intentando un segundo deploy con
# `cloudflare/pages-action@v1` contra un proyecto Pages que ya no es el
# que sirve el sitio — dos pipelines de deploy corriendo en paralelo
# contra el mismo nombre, candidato fuerte a builds fallidos fantasma en
# el dashboard de Cloudflare. Se deja este workflow solo como gate de CI
# (falla el check de GitHub si algo rompe), sin ningún paso de deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: |
          set +e
          npx vitest run --reporter=default > /tmp/test-output.txt 2>&1
          code=$?
          cat /tmp/test-output.txt
          if [ $code -ne 0 ]; then
            tail -c 3500 /tmp/test-output.txt | sed ':a;N;$!ba;s/\n/%0A/g' > /tmp/test-output-encoded.txt
            echo "::error::$(cat /tmp/test-output-encoded.txt)"
          fi
          exit $code

      - name: Run verification scripts
        run: npm run verify:min-count && npm run verify:content && npm run verify:relations && npm run verify:manufacturer-slugs && npm run verify:reserved-keys && npm run verify:seo && npm run verify:adsense-csp && npm run verify:tailwind

      - name: Run price format audit
        run: npm run audit:price-formats

      # No bloqueante todavía (Fase 4 de la auditoría): al momento de sumar
      # este check, el catálogo real tiene 8 vehículos sin imagen pendientes
      # de la Fase 3 (workflow de Commons) — ver
      # docs/auditoria-automatizacion-sinfrenos.md sección C2. Bloquear el
      # build ahora rompería el deploy de contenido que ya está en
      # producción, por el mismo motivo que check-evidence-links no bloquea
      # más abajo. Sacar `continue-on-error` una vez que esos 8 slugs (o los
      # que queden pendientes en ese momento) tengan su imagen.
      - name: Verify image coverage (non-blocking until Fase 3 resuelva las imágenes pendientes)
        continue-on-error: true
        run: npm run verify:image-coverage

      # No bloqueante: chequea 318 URLs externas de evidencia citada en el
      # contenido. Un link caído (rate-limit, mantenimiento, bot-blocking del
      # sitio de terceros, etc.) no debe tumbar un deploy de producción por
      # algo fuera del propio repo. El reporte queda igual visible en el log
      # del job y en broken-links-report.json para revisión manual — ver
      # sección 8 de la auditoría (docs/auditoria-automatizacion-sinfrenos.md)
      # sobre por qué esto se mantiene informativo en vez de bloqueante hasta
      # tener una corrida real en CI que confirme que no es demasiado ruidoso.
      - name: Check evidence links (non-blocking)
        continue-on-error: true
        run: npm run check:evidence-links

      - name: Upload broken links report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broken-links-report
          path: broken-links-report.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Build (verificación — el deploy real lo hace Cloudflare Workers Builds)
        run: npm run build:cf
        env:
          NEXT_PUBLIC_SITE_URL: https://sinfreno.com
