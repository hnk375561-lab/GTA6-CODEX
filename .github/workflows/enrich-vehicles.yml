name: 🚗 Enriquecimiento automático de fichas técnicas

on:
  schedule:
    # Corre cada día a las 2 AM UTC (11 PM Buenos Aires)
    - cron: '0 2 * * *'
  workflow_dispatch: # Manual trigger desde GitHub
  push:
    paths:
      - '.github/workflows/enrich-vehicles.yml'

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    # BUG encontrado (09/09/2026): tenía `pull-requests: write` pero este
    # job nunca abre un PR (commitea y pushea directo a main más abajo) —
    # permiso de más sin uso real, contra el principio de mínimo
    # privilegio. Sacado.
    permissions:
      contents: write
    
    steps:
      - name: 📥 Clonar repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: 📦 Instalar dependencias
        run: npm ci
      
      - name: 🚀 Ejecutar enriquecedor por familia de motores
        run: node enricher-motor-families.mjs
        timeout-minutes: 25
      
      - name: 📊 Análisis de completitud
        id: analyze
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const dir = './src/content/vehiculos';
          const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
          let complete = 0;
          files.forEach(f => {
            const data = JSON.parse(fs.readFileSync(path.join(dir, f)));
            if (data.especificacionesMotor && Object.keys(data.especificacionesMotor).length > 3) {
              complete++;
            }
          });
          console.log(\`Complete: \${complete}/${files.length}\`);
          fs.writeFileSync('enrichment-report.txt', \`Enriquecimiento completado: \${complete}/\${files.length} vehículos\\nFecha: \${new Date().toISOString()}\`);
          " || true
      
      # BUG encontrado (09/09/2026): este job pushea directo a main con
      # `contents: write` sin correr NINGUNA verificación sobre lo que el
      # enriquecedor escribió — ni type-check, ni verify:min-count, ni
      # verify:reserved-keys. Un JSON con forma inválida (o un campo con
      # el tipo equivocado) llegaría a producción sin que nadie se
      # entere hasta el próximo build o la próxima sesión manual. Se
      # deja afuera `verify:content` (corre `next build` completo, no
      # entra en el timeout de este job) y `verify:all`/tests (no
      # aplican a datos de contenido) — estos 3 checks son los que
      # cubren específicamente la forma de las entidades y corren en
      # segundos, no minutos.
      - name: ✅ Verificar antes de pushear (aborta sin pushear si falla)
        run: |
          npm run type-check
          npm run verify:min-count
          npm run verify:reserved-keys

      - name: 📤 Commit y push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "🤖 Enriquecedor automático"
          
          # Verificar si hay cambios
          if [[ -n $(git status -s) ]]; then
            git add src/content/vehiculos/
            git add enrichment-report.txt || true
            git commit -m "🤖 Enriquecimiento automático: actualización de fichas técnicas $(date +%Y-%m-%d)"
            git push
            echo "✅ Cambios enviados"
          else
            echo "ℹ️  Sin cambios que enviar"
          fi
      
      - name: 📝 Resumen
        if: always()
        run: |
          echo "## ✅ Ciclo de enriquecimiento completado" >> $GITHUB_STEP_SUMMARY
          echo "- Familia de motores: ✓" >> $GITHUB_STEP_SUMMARY
          echo "- Datos de Motor1: ✓" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date)" >> $GITHUB_STEP_SUMMARY
          cat enrichment-report.txt >> $GITHUB_STEP_SUMMARY || true
