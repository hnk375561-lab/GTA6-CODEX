name: 🚗 Enriquecimiento automático de fichas técnicas

on:
  schedule:
    # Corre cada día a las 2 AM UTC (11 PM Buenos Aires)
    - cron: '0 2 * * *'
  workflow_dispatch: # Manual trigger desde GitHub
  push:
    paths:
      - '.github/workflows/enrich-vehicles.yml'

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    # Actualización (09/09/2026): este job SÍ abre PR ahora (ver el step
    # "Abrir PR" más abajo), así que `pull-requests: write` vuelve a hacer
    # falta — no es el mismo permiso de más que se sacó antes, ahora tiene
    # uso real. `contents: write` sigue haciendo falta para crear la rama
    # con el commit del enriquecimiento.
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: 📥 Clonar repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: 📦 Instalar dependencias
        run: npm ci
      
      - name: 🚀 Ejecutar enriquecedor por familia de motores
        run: node enricher-motor-families.mjs
        timeout-minutes: 25
      
      - name: 📊 Análisis de completitud
        id: analyze
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const dir = './src/content/vehiculos';
          const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
          let complete = 0;
          files.forEach(f => {
            const data = JSON.parse(fs.readFileSync(path.join(dir, f)));
            if (data.especificacionesMotor && Object.keys(data.especificacionesMotor).length > 3) {
              complete++;
            }
          });
          console.log(\`Complete: \${complete}/${files.length}\`);
          fs.writeFileSync('enrichment-report.txt', \`Enriquecimiento completado: \${complete}/\${files.length} vehículos\\nFecha: \${new Date().toISOString()}\`);
          " || true
      
      # Estos 3 checks cubren específicamente la forma de las entidades y
      # corren en segundos, no minutos — por eso van acá, antes de abrir
      # el PR, y abortan el job si fallan (así no se abre un PR con datos
      # rotos). Se dejan afuera `verify:content` (corre `next build`
      # completo, no entra en el timeout de este job) y `verify:all`/tests
      # (no aplican a datos de contenido); esos quedan para el CI normal
      # que corre sobre el PR antes de mergear.
      - name: ✅ Verificar antes de abrir PR (aborta sin PR si falla)
        run: |
          npm run type-check
          npm run verify:min-count
          npm run verify:reserved-keys

      - name: 📤 Commit en rama nueva
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "🤖 Enriquecedor automático"

          if [[ -n $(git status -s) ]]; then
            git add src/content/vehiculos/
            git add enrichment-report.txt || true
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️  Sin cambios que enviar"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Mismo patrón que .github/workflows/commons-image-manifest.yml:
      # en vez de pushear directo a main, se abre un PR. Antes, un dato
      # mal enriquecido por la IA/fuente externa (Motor1) podía llegar a
      # producción sin que nadie lo viera — los 3 checks de arriba
      # validan forma, no que el contenido sea correcto. Ahora hay un
      # gate humano real: alguien revisa el diff del PR antes de
      # mergear, que es justo lo que faltaba.
      - name: 📤 Abrir PR con el enriquecimiento
        if: steps.commit.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "🤖 Enriquecimiento automático: actualización de fichas técnicas"
          title: "🤖 Enriquecimiento automático de fichas técnicas (run ${{ github.run_id }})"
          body: |
            PR automático generado por `enricher-motor-families.mjs` corriendo en
            Actions (workflow `enrich-vehicles.yml`, disparado por el cron diario
            de las 2 AM UTC o manualmente).

            Pasaron `type-check`, `verify:min-count` y `verify:reserved-keys`
            antes de llegar a este PR — esos checks validan que la forma de las
            entidades sea correcta, no que el contenido enriquecido lo sea.

            **Antes de mergear, revisar el diff**: confirmar que los datos que
            trajo Motor1/la IA para cada vehículo son correctos. Este PR **no se
            mergea automáticamente**.
          branch: bot/enrich-vehicles
          delete-branch: true
          add-paths: |
            src/content/vehiculos/
            enrichment-report.txt
      
      - name: 📝 Resumen
        if: always()
        run: |
          echo "## ✅ Ciclo de enriquecimiento completado" >> $GITHUB_STEP_SUMMARY
          echo "- Familia de motores: ✓" >> $GITHUB_STEP_SUMMARY
          echo "- Datos de Motor1: ✓" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date)" >> $GITHUB_STEP_SUMMARY
          cat enrichment-report.txt >> $GITHUB_STEP_SUMMARY || true
