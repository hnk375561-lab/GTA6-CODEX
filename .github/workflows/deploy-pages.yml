name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # HALLAZGO F-01 (auditoría forense 12/09/2026): este workflow y
  # `deploy.yml` (el gate de type-check/lint/test) se disparaban los dos
  # con `push a main`, EN PARALELO, sin que uno dependiera del otro. Un
  # commit que rompía type-check, lint o tests igual terminaba publicado
  # en GitHub Pages, porque GitHub Actions no bloquea un workflow por el
  # resultado de otro workflow distinto salvo que se lo indiques
  # explícitamente (`needs`, o `workflow_run`).
  #
  # Solución elegida: en vez de encadenar dos workflows separados con
  # `workflow_run` (frágil — depende del nombre exacto del otro workflow
  # y de permisos extra para leer su conclusion), este mismo workflow
  # ahora se auto-gatea: corre su propia verificación de tipos/lint/tests
  # como primer job, y el job de `build` requiere (`needs:`) que ese job
  # haya terminado en verde. `deploy.yml` sigue existiendo tal cual
  # estaba y sigue corriendo en cada push/PR — sirve como señal visible
  # en la pestaña Actions y en PRs — pero la publicación real a
  # producción ya NO depende únicamente de que alguien lo mire.
  #
  # HALLAZGO F-02 (Fase 1 Supabase, 12/09/2026): se cambió `npm ci` por
  # `npm install` en los dos jobs de abajo. Motivo: el proyecto se edita
  # 100% desde la web de GitHub (sin terminal local), así que
  # `package-lock.json` se actualiza a mano junto con `package.json` sin
  # poder correr `npm install` localmente antes de commitear. `npm ci`
  # exige que el lockfile esté sincronizado byte a byte con package.json
  # o falla inmediatamente; `npm install` en cambio actualiza el lockfile
  # sobre la marcha durante el build. Trade-off consciente: se pierde
  # algo de reproducibilidad estricta entre builds a cambio de poder
  # seguir trabajando sin terminal. Si en el futuro se empieza a trabajar
  # con Codespaces o una compu con Node local, se puede volver a `npm ci`
  # corriendo `npm install` una vez ahí para resincronizar el lockfile.
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22, no 20: jsdom@30 (usado por los tests, ver
          # vitest.setup.ts) declara
          # "engines": { "node": "^22.22.2 || ^24.15.0 || >=26.0.0" } —
          # con Node 20.x el test runner revienta al importar `undici`
          # ("TypeError: webidl.util.markAsUncloneable is not a
          # function") antes de correr un solo test. Este es el MISMO
          # motivo ya documentado en deploy.yml (NODE_VERSION: '22.x') —
          # se copió el Node 20 del job `build` de más abajo (que sí
          # puede quedarse en 20, porque no corre tests) sin adaptarlo a
          # este job nuevo. Confirmado como causa raíz real corriendo
          # este workflow en GitHub Actions el 12/09/2026: el job
          # `quality-gate` falló en el step "Test" con Node 20 mientras
          # que type-check y lint sí pasaban — exactamente el síntoma
          # que predice el comentario de deploy.yml.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate content bundle
        run: node scripts/generate-content-bundle.mjs

      - name: Pregenerate image variants
        run: node scripts/pregenerate-image-variants.mjs

      - name: Build (static export)
        run: npx next build
        env:
          # Dejar VACÍO si el sitio usa dominio propio (public/CNAME,
          # sirve en la raíz). Poner "/Sin-Frenos" (el nombre del repo,
          # con la barra inicial) SOLO si en vez de dominio propio se usa
          # la URL default de GitHub Pages
          # (hnk375561-lab.github.io/Sin-Frenos) — ver next.config.js.
          GITHUB_PAGES_BASE_PATH: '/Sin-Frenos'
          NEXT_PUBLIC_SITE_URL: https://hnk375561-lab.github.io/Sin-Frenos

          # ------------------------------------------------------------
          # FASE 1 — SUPABASE (agregado 12/09/2026)
          # Van como Repository VARIABLE (${{ vars.* }}), no secret,
          # porque la anon key es pública por diseño de Supabase — igual
          # termina horneada en el HTML/JS público, mismo criterio ya
          # usado acá abajo con NEXT_PUBLIC_GA_ID. Configurar en:
          # Settings → Secrets and variables → Actions → pestaña
          # "Variables" → New repository variable.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

          # ------------------------------------------------------------
          # HALLAZGO #1 (auditoría FASE 2, 12/09/2026): estas 24 variables
          # NEXT_PUBLIC_* NO se leían acá. El sitio es `output: 'export'`
          # (estático puro) — Next.js las hornea en el HTML/JS en BUILD
          # TIME, no existen en runtime porque no hay runtime. Si este
          # step no las lee (ni como `env:` ni como `${{ secrets.* }}` /
          # `${{ vars.* }}`), quedan `undefined` para siempre en cada
          # página publicada, sin importar qué tenga cargado el repo en
          # "Settings → Secrets and variables" — el workflow simplemente
          # nunca las leía.
          #
          # Configuración requerida ANTES de que este workflow corra en
          # verde con datos reales — en GitHub: Settings → Secrets and
          # variables → Actions:
          #   - Como Repository secret: todo lo que sea token/ID de
          #     cuenta que preferís no dejar en texto plano en el repo
          #     (AdSense client ID, GA ID, CF Analytics token, tag de
          #     afiliado MELI, URLs/entry IDs de los 3 Google Forms).
          #   - Como Repository variable (${{ vars.* }}): lo que ya es
          #     público de todas formas y no necesita el nivel de
          #     protección de un secret (ej. NEXT_PUBLIC_GA_ID, que
          #     igual queda visible en el HTML publicado).
          # Cualquier variable de las de abajo que dejes sin cargar en
          # GitHub queda simplemente vacía (${{ secrets.X }} sin setear
          # resuelve a string vacío) y su componente correspondiente
          # sigue degradando a "no renderiza nada", igual que hoy — no
          # rompe el build.

          # AdSense (AdUnit.tsx, ConsentBanner, ads.txt ya sirve solo)
          NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
          NEXT_PUBLIC_ADSENSE_ANCHOR_SLOT_ID: ${{ secrets.NEXT_PUBLIC_ADSENSE_ANCHOR_SLOT_ID }}

          # Google Analytics 4 / gtag.js (activa también ConsentBanner)
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

          # Cloudflare Web Analytics (beacon en layout.tsx)
          NEXT_PUBLIC_CF_ANALYTICS_TOKEN: ${{ secrets.NEXT_PUBLIC_CF_ANALYTICS_TOKEN }}

          # Afiliado MercadoLibre — sin el tag, el botón funciona pero
          # sin comisión
          NEXT_PUBLIC_MELI_AFFILIATE_TAG: ${{ secrets.NEXT_PUBLIC_MELI_AFFILIATE_TAG }}

          # Afiliados seguro / financiación
          NEXT_PUBLIC_SEGURO_AFFILIATE_URL: ${{ secrets.NEXT_PUBLIC_SEGURO_AFFILIATE_URL }}
          NEXT_PUBLIC_FINANCIACION_AFFILIATE_URL: ${{ secrets.NEXT_PUBLIC_FINANCIACION_AFFILIATE_URL }}
          NEXT_PUBLIC_FINTECH_AFFILIATE_NAME: ${{ vars.NEXT_PUBLIC_FINTECH_AFFILIATE_NAME }}
          NEXT_PUBLIC_FINTECH_AFFILIATE_URL: ${{ secrets.NEXT_PUBLIC_FINTECH_AFFILIATE_URL }}

          # Cafecito
          NEXT_PUBLIC_CAFECITO_USERNAME: ${{ vars.NEXT_PUBLIC_CAFECITO_USERNAME }}

          # Ads nativos (Taboola/Outbrain/etc.)
          NEXT_PUBLIC_NATIVE_ADS_SCRIPT_SRC: ${{ secrets.NEXT_PUBLIC_NATIVE_ADS_SCRIPT_SRC }}
          NEXT_PUBLIC_NATIVE_ADS_CONTAINER_ID: ${{ secrets.NEXT_PUBLIC_NATIVE_ADS_CONTAINER_ID }}

          # Google Forms — cotización/compra (LeadQuoteForm.tsx). Sin
          # estas 5, cae a mailto: por diseño (no rompe nada).
          NEXT_PUBLIC_LEADS_GFORM_ACTION_URL: ${{ secrets.NEXT_PUBLIC_LEADS_GFORM_ACTION_URL }}
          NEXT_PUBLIC_LEADS_GFORM_ENTRY_NOMBRE: ${{ secrets.NEXT_PUBLIC_LEADS_GFORM_ENTRY_NOMBRE }}
          NEXT_PUBLIC_LEADS_GFORM_ENTRY_CONTACTO: ${{ secrets.NEXT_PUBLIC_LEADS_GFORM_ENTRY_CONTACTO }}
          NEXT_PUBLIC_LEADS_GFORM_ENTRY_VEHICULO: ${{ secrets.NEXT_PUBLIC_LEADS_GFORM_ENTRY_VEHICULO }}
          NEXT_PUBLIC_LEADS_GFORM_ENTRY_COMENTARIO: ${{ secrets.NEXT_PUBLIC_LEADS_GFORM_ENTRY_COMENTARIO }}

          # Google Forms — venta (SellVehicleLeadForm.tsx). Mismo
          # fallback a mailto: si faltan.
          NEXT_PUBLIC_VENTA_GFORM_ACTION_URL: ${{ secrets.NEXT_PUBLIC_VENTA_GFORM_ACTION_URL }}
          NEXT_PUBLIC_VENTA_GFORM_ENTRY_NOMBRE: ${{ secrets.NEXT_PUBLIC_VENTA_GFORM_ENTRY_NOMBRE }}
          NEXT_PUBLIC_VENTA_GFORM_ENTRY_CONTACTO: ${{ secrets.NEXT_PUBLIC_VENTA_GFORM_ENTRY_CONTACTO }}
          NEXT_PUBLIC_VENTA_GFORM_ENTRY_VEHICULO: ${{ secrets.NEXT_PUBLIC_VENTA_GFORM_ENTRY_VEHICULO }}
          NEXT_PUBLIC_VENTA_GFORM_ENTRY_COMENTARIO: ${{ secrets.NEXT_PUBLIC_VENTA_GFORM_ENTRY_COMENTARIO }}

          # Google Forms — trámites (TramitesLeadForm.tsx). Mismo
          # fallback a mailto: si faltan. NOTA: la auditoría PDF original
          # decía "2 formularios" (compra/venta) — en realidad son 3, este
          # es el tercero, encontrado en esta ronda al grepear src/ entero.
          NEXT_PUBLIC_TRAMITES_GFORM_ACTION_URL: ${{ secrets.NEXT_PUBLIC_TRAMITES_GFORM_ACTION_URL }}
          NEXT_PUBLIC_TRAMITES_GFORM_ENTRY_NOMBRE: ${{ secrets.NEXT_PUBLIC_TRAMITES_GFORM_ENTRY_NOMBRE }}
          NEXT_PUBLIC_TRAMITES_GFORM_ENTRY_CONTACTO: ${{ secrets.NEXT_PUBLIC_TRAMITES_GFORM_ENTRY_CONTACTO }}
          NEXT_PUBLIC_TRAMITES_GFORM_ENTRY_TRAMITE: ${{ secrets.NEXT_PUBLIC_TRAMITES_GFORM_ENTRY_TRAMITE }}
          NEXT_PUBLIC_TRAMITES_GFORM_ENTRY_COMENTARIO: ${{ secrets.NEXT_PUBLIC_TRAMITES_GFORM_ENTRY_COMENTARIO }}

          # NOTA: NEXT_PUBLIC_WHATSAPP_NUMBER y NEXT_PUBLIC_BLOB_BASE_URL
          # NO se agregan acá a propósito — ambos ya tienen default
          # hardcodeado seguro en el código (FinancingCalculator.tsx e
          # image-loader.ts respectivamente) y degradan bien sin esta
          # variable. Descomentar solo si querés overridearlos:
          # NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          # NEXT_PUBLIC_BLOB_BASE_URL: ${{ vars.NEXT_PUBLIC_BLOB_BASE_URL }}

      - name: Recalcular hashes CSP por página (fix real 12/9/2026)
        # El <meta> de CSP en src/app/layout.tsx traía un ÚNICO hash
        # sha256 hardcodeado (el del snippet anti-FOUC de dark mode). Pero
        # cada página estática lleva además varios <script> inline propios
        # de Next.js (self.__next_f.push([...]), el payload de hidratación
        # de React Server Components), con contenido — y por lo tanto hash
        # — distinto en cada página. Ese único hash fijo nunca los cubría:
        # el navegador los bloqueaba por CSP, React fallaba al hidratar
        # ("Minified React error #412") y las páginas con más
        # interactividad cliente (sobre todo /vehiculos/, con hasta 36
        # scripts inline por página) se quedaban con las tarjetas vacías.
        # Este script recorre cada .html generado, calcula el hash real de
        # TODOS sus scripts inline, y reescribe el script-src de ESE
        # archivo con exactamente esos hashes — ver
        # scripts/inject-csp-hashes.mjs para el detalle completo.
        run: node scripts/inject-csp-hashes.mjs

      - name: Evitar procesamiento Jekyll (rompe /_next/*, ver public/.nojekyll)
        # public/.nojekyll ya se copia solo a out/ en el export estático de
        # Next.js, pero este paso es un seguro extra explícito: sin este
        # archivo en la raíz de lo publicado, GitHub Pages procesa el sitio
        # con Jekyll, que ignora cualquier carpeta que empiece con "_"
        # (jekyll considera esas carpetas "especiales") — y TODO el CSS/JS
        # de Next.js vive en /_next/. Resultado: el HTML carga pero sin
        # estilos ni scripts (404 silencioso en cada asset). Confirmado como
        # causa raíz el 10/09/2026 tras el primer deploy exitoso del sitio.
        run: touch ./out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
