name: Post-Deploy Smoke Test

# Fase 4 de docs/auditoria-automatizacion-sinfrenos.md.
#
# Hasta esta fase no había ningún chequeo de que el sitio en producción
# realmente respondiera después de un deploy — "no hay monitoreo de
# uptime/post-deploy del sitio en vivo... un smoke test post-deploy es
# barato y de alto valor" (sección 4, ítems I-K).
#
# Se dispara solo cuando "Deploy to Cloudflare Pages" TERMINA en push a
# main (o sea, después de un deploy real a producción, no en cada PR de
# preview). Si alguna URL clave no devuelve 200, este workflow falla — la
# notificación ES la falla del workflow mismo, visible en la pestaña
# Actions y en el email/resumen que GitHub ya manda por default con
# workflows fallidos. No se suma ningún servicio de monitoring externo
# (Sentry, Datadog, etc. — descartados explícitamente en sección 16).

on:
  workflow_run:
    workflows: ["Deploy to Cloudflare Pages"]
    types: [completed]
    branches: [main]

jobs:
  smoke-test:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://sinfreno.com
    steps:
      # Cloudflare Pages tarda unos segundos en propagar el deploy nuevo
      # detrás de su CDN. Un margen chico evita falsos negativos por pegarle
      # a la versión anterior o a un edge todavía no actualizado.
      - name: Esperar propagación del deploy
        run: sleep 30

      - name: Chequear URLs clave (esperado 200 en cada una)
        run: |
          set -e
          urls=(
            "$SITE_URL/"
            "$SITE_URL/vehiculos"
            "$SITE_URL/vehiculos/toyota-hilux"
            "$SITE_URL/fabricantes"
            "$SITE_URL/sitemap.xml"
          )
          fail=0
          for url in "${urls[@]}"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 15 "$url" || echo "000")
            if [ "$code" = "200" ]; then
              echo "✓ $url -> $code"
            else
              echo "✗ $url -> $code"
              fail=1
            fi
          done
          if [ "$fail" -eq 1 ]; then
            echo ""
            echo "smoke-test: FALLÓ — al menos una URL clave no devolvió 200 después del deploy a producción."
            exit 1
          fi
          echo ""
          echo "smoke-test: OK — las 5 URLs clave respondieron 200."
