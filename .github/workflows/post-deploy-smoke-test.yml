name: Post-Deploy Smoke Test

# Smoke test post-deploy: confirma que el sitio en producción realmente
# responde después de cada deploy. Antes de este workflow no había ningún
# monitoreo de uptime/post-deploy del sitio en vivo — un smoke test
# post-deploy es barato de mantener y de alto valor si algo se rompe en
# producción sin que nadie lo note.
#
# BUG encontrado y corregido (09/09/2026): este workflow nunca se disparó
# ni una sola vez desde que existe. `workflow_run` escuchaba el nombre
# "Deploy to Cloudflare Pages", pero ese workflow ya no existe con ese
# nombre — se renombró a "CI (type-check, lint, test, build)" en el
# commit d03717eb (07/09/2026, ver deploy.yml), sin que se actualizara
# este archivo al mismo tiempo. GitHub matchea `workflow_run` por nombre
# exacto, así que un rename sin tocar este archivo lo deja huérfano para
# siempre, sin ningún error visible — simplemente no corre nunca.
#
# Además, el deploy real a producción NO lo hace ningún workflow de
# GitHub Actions: lo hace Cloudflare Workers Builds vía su integración
# git nativa (ver comentario en deploy.yml), que no emite ningún evento
# que Actions pueda escuchar. Por eso este workflow ahora dispara sobre
# el `push` a main directamente (mismo trigger que la CI) en vez de
# encadenarse a un workflow_run que no puede representar "el deploy ya
# terminó" — y el chequeo reintenta con backoff en vez de un sleep fijo,
# porque el build+deploy de Cloudflare Workers Builds puede tardar
# varios minutos (ver notas de ~13min en sesiones anteriores) y un sleep
# corto daría falsos negativos.

on:
  push:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://sinfreno.com
    steps:
      - name: Chequear URLs clave (esperado 200 en cada una, con reintentos)
        run: |
          set -e
          urls=(
            "$SITE_URL/"
            "$SITE_URL/vehiculos"
            "$SITE_URL/vehiculos/toyota-hilux"
            "$SITE_URL/fabricantes"
            "$SITE_URL/sitemap.xml"
          )
          # Cloudflare Workers Builds no emite ningún evento que Actions
          # pueda esperar, así que en vez de un sleep fijo se reintenta
          # en rondas (todas las URLs pendientes por ronda, no una URL a
          # la vez) hasta 12 minutos totales antes de darlas por caídas —
          # suficiente margen para un build+deploy típico (~13min en
          # corridas previas) sin bloquear el job más de lo necesario.
          max_rounds=24
          sleep_between=30
          pending=("${urls[@]}")
          for round in $(seq 1 "$max_rounds"); do
            still_pending=()
            for url in "${pending[@]}"; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 15 "$url" || echo "000")
              if [ "$code" = "200" ]; then
                echo "✓ $url -> $code (ronda $round)"
              else
                still_pending+=("$url")
              fi
            done
            pending=("${still_pending[@]}")
            if [ "${#pending[@]}" -eq 0 ]; then
              break
            fi
            if [ "$round" -lt "$max_rounds" ]; then
              sleep "$sleep_between"
            fi
          done
          if [ "${#pending[@]}" -gt 0 ]; then
            echo ""
            echo "smoke-test: FALLÓ — no respondieron 200 tras ${max_rounds} rondas:"
            printf '  ✗ %s\n' "${pending[@]}"
            exit 1
          fi
          echo ""
          echo "smoke-test: OK — las 5 URLs clave respondieron 200."
