name: Post-Deploy Smoke Test

# Smoke test post-deploy: confirma que el sitio en producción realmente
# responde después de cada deploy. Antes de este workflow no había ningún
# monitoreo de uptime/post-deploy del sitio en vivo — un smoke test
# post-deploy es barato de mantener y de alto valor si algo se rompe en
# producción sin que nadie lo note.
#
# 10/09/2026 — Migración a GitHub Pages: SITE_URL ahora apunta a
# hnk375561-lab.github.io/Sin-Frenos (no hay dominio propio conectado).
# El trigger sigue siendo `push` a main directamente en vez de
# encadenarse a un `workflow_run` de "Deploy to GitHub Pages": el deploy
# de Pages corre en paralelo (job separado, mismo push), y este smoke
# test reintenta con backoff hasta 12 minutos para darle tiempo a
# terminar sin acoplarse al nombre exacto de ese otro workflow (mismo
# problema de acoplamiento por nombre que ya rompió esto una vez,
# documentado en el historial de este archivo).

on:
  push:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://hnk375561-lab.github.io/Sin-Frenos
    steps:
      - name: Chequear URLs clave (esperado 200 en cada una, con reintentos)
        run: |
          set -e
          urls=(
            "$SITE_URL/"
            "$SITE_URL/vehiculos"
            "$SITE_URL/vehiculos/toyota-hilux"
            "$SITE_URL/fabricantes"
            "$SITE_URL/sitemap.xml"
          )
          # El job de deploy (deploy-pages.yml) corre en paralelo a este,
          # sin emitir ningún evento que este workflow pueda esperar, así
          # que en vez de un sleep fijo se reintenta en rondas (todas las
          # URLs pendientes por ronda, no una URL a la vez) hasta 12
          # minutos totales antes de darlas por caídas — margen suficiente
          # para un build+deploy típico sin bloquear el job de más.
          max_rounds=24
          sleep_between=30
          pending=("${urls[@]}")
          for round in $(seq 1 "$max_rounds"); do
            still_pending=()
            for url in "${pending[@]}"; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 15 "$url" || echo "000")
              if [ "$code" = "200" ]; then
                echo "✓ $url -> $code (ronda $round)"
              else
                still_pending+=("$url")
              fi
            done
            pending=("${still_pending[@]}")
            if [ "${#pending[@]}" -eq 0 ]; then
              break
            fi
            if [ "$round" -lt "$max_rounds" ]; then
              sleep "$sleep_between"
            fi
          done
          if [ "${#pending[@]}" -gt 0 ]; then
            echo ""
            echo "smoke-test: FALLÓ — no respondieron 200 tras ${max_rounds} rondas:"
            printf '  ✗ %s\n' "${pending[@]}"
            exit 1
          fi
          echo ""
          echo "smoke-test: OK — las 5 URLs clave respondieron 200."
