name: Commons Image Manifest

# Fase 3 de docs/auditoria-automatizacion-sinfrenos.md.
#
# Cierra el gap entre lo que el README describe ("workflow manual... en
# Actions") y lo que hasta ahora existía en .github/workflows/ (nada —
# el paso se corría a mano en una terminal). Este workflow es ese botón
# manual real: corre generate-manifest-from-commons.mjs contra la API
# pública de Wikimedia (sin secrets nuevos) y, si encuentra fotos nuevas
# para vehículos sin imagen, abre un PR con el manifest actualizado.
#
# Lo que este workflow NO hace, a propósito (sección 16 de la auditoría):
# no mergea el PR solo, y no corre process-images.mjs --apply. La
# confirmación visual de que cada foto es del modelo/año correcto sigue
# siendo 100% humana, PR por PR.
#
# El cron periódico (Fase 5) se agrega después, sumando un trigger
# `schedule` a este mismo archivo — no es parte de esta fase.

on:
  workflow_dispatch:
    inputs:
      retry_notfound:
        description: >-
          Reintentar también los vehículos que quedaron en "notFound" en
          corridas anteriores (en vez de respetar el cache y saltarlos)
        required: false
        default: false
        type: boolean

# Evita que dos corridas manuales superpuestas generen dos PRs distintos
# contra el mismo manifest (riesgo identificado en sección 8 de la
# auditoría). cancel-in-progress en false porque preferimos encolar la
# segunda corrida a perder su resultado.
concurrency:
  group: commons-image-manifest
  cancel-in-progress: false

env:
  NODE_VERSION: '20.x'

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generar manifest desde Wikimedia Commons
        run: |
          if [ "${{ github.event.inputs.retry_notfound }}" = "true" ]; then
            npm run generate:manifest-commons:write -- --retry-notfound
          else
            npm run generate:manifest-commons:write
          fi

      - name: Abrir PR si el manifest o el cache cambiaron
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(images): actualizar manifest de Commons'
          title: 'chore(images): actualizar manifest de imágenes de Commons'
          body: |
            PR automático — Fase 3 de `docs/auditoria-automatizacion-sinfrenos.md`.

            Generado por `generate-manifest-from-commons.mjs --write` corriendo
            en Actions (workflow `commons-image-manifest.yml`, disparado a mano
            desde la pestaña Actions).

            **Antes de mergear, confirmar visualmente** que cada foto nueva
            corresponde al modelo y año correctos del vehículo. Este paso queda
            humano a propósito (sección 16 de la auditoría): la búsqueda en
            Commons puede traer un modelo o año equivocado, y Zod valida forma,
            no que la foto sea la correcta.

            Este PR **no se mergea automáticamente**.
          branch: chore/commons-image-manifest
          delete-branch: true
          add-paths: |
            real-images-manifest.json
            .commons-image-cache.json
