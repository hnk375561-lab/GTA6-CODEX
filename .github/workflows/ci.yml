name: CI

# IMPORTANTE: GitHub Actions solo lee workflows desde .github/workflows/
# en la RAÍZ del repo (este archivo). Durante un tiempo convivió una copia
# en GTA6-CODEX/.github/workflows/ci.yml que parecía "la buena" pero nunca
# se ejecutaba realmente — quedó eliminada para evitar que alguien la edite
# pensando que tiene efecto. Si el pipeline necesita cambios, es acá.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Serializa las corridas de CI en la misma rama: si dos pushes llegan
# casi juntos (por ejemplo, varios PRs de Dependabot mergeando o
# corridas manuales seguidas), la segunda cancela a la primera en vez
# de correr en paralelo. Se sospecha que corridas simultaneas competian
# por el mismo cache de npm (misma key, mismo lockfile) y de ahi salio
# un fallo intermitente en "Unit tests" (visto una vez en ~10 corridas,
# justo en medio de una rafaga de PRs de Dependabot).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: GTA6-CODEX

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escaneo de secretos (historial completo)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: GTA6-CODEX/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: npm test 2>&1 | tee /tmp/unit-tests-output.txt

      # Diagnostico permanente: si "Unit tests" falla, vuelca el output
      # completo al Job Summary (legible via API/UI sin depender del
      # blob storage de logs) antes de cortar el pipeline. El fallo es
      # intermitente (visto ~3 de 15 corridas) asi que hace falta
      # capturarlo la proxima vez que pase.
      - name: Diagnostico Unit tests si falla
        if: always()
        run: |
          if [ "${{ steps.unit_tests.outcome }}" = "failure" ]; then
            echo '## FALLO en "npm test"' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -c 60000 /tmp/unit-tests-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Chequeo de regresión para el bug del BOM UTF-8: si el catálogo de
      # vehículos colapsa (por un BOM, un cambio en el loader, en el
      # validador Zod, etc.) este paso falla el pipeline en vez de dejar
      # pasar un build "verde" con el sitio vacío.
      - name: Verify minimum entity count (anti-catálogo-vacío)
        run: npm run verify:min-count

      - name: Verify content integrity
        run: npm run verify:content

      - name: Verify relations integrity
        run: npm run verify:relations

      - name: Verify reserved entity keys
        run: npm run verify:reserved-keys

      - name: Verify SEO routes
        run: npm run verify:seo

      # Falla el pipeline si alguna ficha nueva quedo sin evidence
      # (primarySource/secondarySource) o sin contenido - asi nadie
      # mergea una ficha "pelada" sin darse cuenta.
      - name: Audit evidence coverage
        run: npm run audit:evidence

      - name: Build
        run: npm run build

      # Corre DESPUÉS del build porque necesita el CSS ya compilado en
      # .next/static/css para confirmar que las clases auto-* (tokens del
      # theme actual) siguen generándose.
      - name: Verify Tailwind config
        run: npm run verify:tailwind
