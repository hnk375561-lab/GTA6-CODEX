# Actualización automática de dependencias (npm + github-actions).
#
# Antes de esto, actualizar dependencias dependía de que alguien se
# acordara de revisar `npm outdated` a mano (package.json tiene ~35
# dependencias directas). Dependabot solo ABRE pull requests; nunca los
# mergea automáticamente — la revisión y el merge siguen siendo humanos.
#
# Agrupado (`groups`) y semanal (no diario) a propósito: sin agrupar,
# cada dependencia menor abre su propio PR y genera ruido que nadie
# termina revisando en serio; agrupado y semanal mantiene el volumen de
# PRs manejable sin perder la actualización regular.
#
# Se cubren dos ecosistemas:
#   - npm: las ~35 dependencias de package.json.
#   - github-actions: las actions de terceros que ya usan los workflows
#     del repo (actions/checkout, actions/setup-node, cloudflare/pages-action,
#     peter-evans/create-pull-request, etc.) — es la misma clase de deuda
#     ("dependencia sin actualización automática") aplicada a CI en vez de
#     a npm, con el mismo mecanismo (Dependabot) y cero costo extra de
#     mantenimiento.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
