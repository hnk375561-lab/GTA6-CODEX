version: 2
updates:
  # Dependencias npm del proyecto (Next.js, React, Zod, etc.)
  - package-ecosystem: "npm"
    directory: "/GTA6-CODEX"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Agrupa actualizaciones menores/patch en un solo PR para no
      # inundar el repo de PRs individuales; los majors quedan aparte
      # para revisar con más cuidado (pueden romper el build).
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Versiones de las Actions usadas en .github/workflows (checkout,
  # setup-node, upload-artifact, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
