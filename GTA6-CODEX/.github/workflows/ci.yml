name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escaneo de secretos (historial completo)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Tests
        run: npm test

      - name: Integridad de contenido
        run: npm run verify:content

      - name: Integridad de relaciones
        run: npm run verify:relations

      - name: Integridad de media
        run: npm run verify:media

      - name: Rutas SEO
        run: npm run verify:seo

      - name: Config de Tailwind
        run: npm run verify:tailwind

      - name: Claves reservadas de entidad
        run: npm run verify:reserved-keys

      - name: Build de producción
        run: npm run build
